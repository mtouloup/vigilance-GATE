[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigilance-gate"
version = "0.1.0"
description = "T5.3 Agentic Wrapper Framework — VIGILANCE GAP-101249737"
requires-python = ">=3.11"
dependencies = [
    "pika>=1.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["vigilance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
