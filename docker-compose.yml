version: "3.9"

# ── T5.3 Agentic Wrapper Framework — docker-compose ───────────────────────────
#
# Services:
#   rabbitmq       Message broker — queues pre-declared at startup
#   ollama         LLM server (mistral:7b + mistral-nemo)
#   ollama-init    One-shot model downloader (exits after pull)
#   vigilance-gate The Agentic Wrapper Framework (T5.3)
#   dozzle         Real-time log viewer → http://localhost:9999
#
# T5.3 is a single multi-pilot container — all four GA pilots are served
# simultaneously (TELECOM, MARITIME, FINANCE, INDUSTRY_4). Pilot detection
# happens per-event in C1; no sector selection needed at startup.
#
# Model storage:
#   Models are stored in the Docker-managed 'ollama_data' volume by default
#   (downloaded once, reused across restarts).
#   To reuse models already on your host:
#     OLLAMA_MODELS_DIR=~/.ollama docker compose up
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── RabbitMQ ─────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: vigilance-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI → http://localhost:15672 (vigilance/vigilance)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Ollama LLM server ─────────────────────────────────────────────────────────
  # No persistent healthcheck — readiness polling is handled once by ollama-init.
  # This avoids repeated HEAD / + GET /api/tags calls (and their GIN access logs)
  # appearing every N seconds for the lifetime of the stack.
  ollama:
    image: ollama/ollama:latest
    container_name: vigilance-ollama
    ports:
      - "11434:11434"   # Ollama REST API
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama_data}:/root/.ollama
    restart: unless-stopped
    # ── GPU (NVIDIA) — uncomment to enable GPU acceleration ───────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Model initialiser (runs once, then exits) ─────────────────────────────────
  # Pulls mistral:7b and mistral-nemo if not already present in the volume.
  # Idempotent — does not re-download models that are already cached.
  # Polls until Ollama's API responds before pulling (replaces the removed healthcheck).
  ollama-init:
    image: ollama/ollama:latest
    container_name: vigilance-ollama-init
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama_data}:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      sh -c "
        echo 'Waiting for Ollama API...' &&
        until ollama list > /dev/null 2>&1; do sleep 2; done &&
        echo 'Ollama ready. Checking models...' &&
        ollama pull mistral:7b &&
        echo 'Models ready.'
      "
    depends_on:
      - ollama
    restart: "no"

  # ── T5.3 Agentic Wrapper Framework ───────────────────────────────────────────
  # Single multi-pilot container — all four GA pilots handled simultaneously.
  # Pilot is detected per-event in C1; no mode or sector configuration needed.
  #
  # Broker (inbound):  pilot.events.raw, t53.action_requests
  # Broker (outbound): t53.canonical_events, t53.results, t53.policy_updates,
  #                    t53.actions.dispatch
  # REST API:          http://localhost:8000/api/docs  (T5.6 integration point)
  #
  # Generated output (./data/ on your host):
  #   workflow_audit.csv  — one row per pipeline execution (raw → canonical → result)
  vigilance-gate:
    build: .
    container_name: vigilance-gate
    ports:
      - "8000:8000"   # REST API → http://localhost:8000/api/docs
    environment:
      AMQP_URL: amqp://vigilance:vigilance@rabbitmq:5672/
      OLLAMA_BASE_URL: http://ollama:11434
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      WORKFLOW_CSV_PATH: /app/data/workflow_audit.csv
      # VIGILANCE_DRY_RUN: "true"   # uncomment to skip broker dispatch (dev only)
    volumes:
      - ./data:/app/data   # generated files → persisted on your host under ./data/
    # chmod ensures the bind-mounted directory is writable regardless of Docker
    # user-namespace remapping or host filesystem ownership at startup.
    command: >
      sh -c "chmod -R 777 /app/data 2>/dev/null || true && python -m vigilance.main"
    depends_on:
      rabbitmq:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: on-failure

  # ── Dozzle — real-time container log viewer ──────────────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: vigilance-dozzle
    ports:
      - "9999:8080"   # log viewer UI → http://localhost:9999
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  rabbitmq_data:
  ollama_data:
