version: "3.9"

# ── T5.3 Agentic Wrapper Framework — docker-compose ───────────────────────────
#
# Services:
#   rabbitmq       Message broker — queues pre-declared at startup
#   ollama         LLM server (mistral:7b + mistral-nemo)
#   ollama-init    One-shot model downloader (exits after pull)
#   vigilance-gate The Agentic Wrapper Framework (T5.3)
#
# Sector selection (default: TELECOM):
#   VIGILANCE_SECTOR=TELECOM     docker compose up   # OTE / Greece
#   VIGILANCE_SECTOR=INDUSTRY_4  docker compose up   # Siemens / Romania
#
# Model storage:
#   Models are stored in the Docker-managed 'ollama_data' volume by default
#   (downloaded once, reused across restarts).
#   To reuse models already on your host:
#     OLLAMA_MODELS_DIR=~/.ollama docker compose up
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── RabbitMQ ─────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: vigilance-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI → http://localhost:15672 (vigilance/vigilance)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Ollama LLM server ─────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: vigilance-ollama
    ports:
      - "11434:11434"   # Ollama REST API
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama_data}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # ── GPU (NVIDIA) — uncomment to enable GPU acceleration ───────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Model initialiser (runs once, then exits) ─────────────────────────────────
  # Pulls mistral:7b and mistral-nemo if not already present in the volume.
  # Idempotent — does not re-download models that are already cached.
  ollama-init:
    image: ollama/ollama:latest
    container_name: vigilance-ollama-init
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama_data}:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      sh -c "
        echo 'Checking models...' &&
        ollama pull mistral:7b &&
        ollama pull mistral-nemo &&
        echo 'Models ready.'
      "
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ── T5.3 Agentic Wrapper Framework ───────────────────────────────────────────
  # This is the single framework container as described in the VIGILANCE GA.
  # Set VIGILANCE_SECTOR to select the active pilot environment:
  #   TELECOM     → OTE pilot (Greece) — default
  #   INDUSTRY_4  → Siemens pilot (Romania)
  vigilance-gate:
    build: .
    container_name: vigilance-gate
    environment:
      VIGILANCE_SECTOR: ${VIGILANCE_SECTOR:-TELECOM}
      AMQP_URL: amqp://vigilance:vigilance@rabbitmq:5672/
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      rabbitmq:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  rabbitmq_data:
  ollama_data:
